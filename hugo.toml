baseURL = "https://atitoken.com/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "嚏语 | 阿嚏的小站"
theme = ["calligraphy"]
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
enableInlineShortcodes = true

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "monokai"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = "production"
  description = "阿嚏的个人博客 — 记录技术、生活与思考"
  keywords = ["博客", "技术", "生活", "阿嚏"]
  author = "阿嚏"
  DateFormat = "2006-01-02"

[params.brand]
  nameShort = "嚏语"
  tagline = "阿嚏的小站"

[params.meta]
  faviconComplete = false

[params.giscus]
  repo = "ATIAboo/blog"
  repoID = ""          # 从 giscus.app 获取
  category = "General"
  categoryID = ""      # 从 giscus.app 获取
  mapping = "pathname"
  strict = "0"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "top"
  theme = "preferred_color_scheme"
  lang = "zh-CN"

[[menu.main]]
  identifier = "posts"
  name = "📝 文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "archives"
  name = "📚 归档"
  url = "/archives/"
  weight = 20

[[menu.main]]
  identifier = "tags"
  name = "🏷️ 标签"
  url = "/tags/"
  weight = 30

[[menu.main]]
  identifier = "search"
  name = "🔍 搜索"
  url = "/search/"
  weight = 40

[[menu.main]]
  identifier = "about"
  name = "🙋 关于"
  url = "/about/"
  weight = 50
