baseURL = "https://atitoken.com/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "嚏语 | 阿嚏的小站"
theme = ["calligraphy"]
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
enableInlineShortcodes = true

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "monokai"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = "production"
  description = "阿嚏的个人博客 — 记录技术、生活与思考"
  keywords = ["博客", "技术", "生活", "阿嚏"]
  author = "阿嚏"
  DateFormat = "2006-01-02"
  mainSections = ["posts"]

[params.brand]
  nameShort = "嚏语"
  tagline = "阿嚏的小站"

[params.meta]
  faviconComplete = false

[params.style]
    ## Type ##
    font_header = "'Playfair Display', serif"
    font_body = "'Source Sans 3', sans-serif"

    ## Transitions ##
    transition_base = "0.3s ease-in-out"

    ## Borders ##
    border_radius-small = "5px"
    border_radius-large = "10px"

    ## Global Colors ##
    color_secondary = "hsl(220, 60%, 50%)"
    color_button = "hsl(160, 50%, 45%)"
    color_text_light = "hsl(0, 0%, 91%)"
    color_text_dark = "hsl(0, 0%, 15%)"

    ## Light Mode Colors ##
    color_primary = "hsl(180, 100%, 35%)"
    color_primary_tint = "hsl(174, 60%, 85%)"
    color_primary_shade = "hsl(180, 100%, 15%)"
    color_canvas = "hsl(0, 0%, 93%)"
    color_canvas_tint = "hsl(0, 0%, 98%)"
    color_canvas_shade = "hsl(217, 15%, 17%)"
    color_text = "hsl(0, 0%, 15%)"
    color_text_muted = "hsl(0, 0%, 45%)"
    color_text_inverted = "hsl(0, 0%, 91%)"
    color_text_link = "hsl(174, 60%, 42%)"
    color_ui_float = "hsl(0, 0%, 86%)"
    border_color = "hsl(220, 16%, 36%)"
    image_filter = "none"

    ## Dark Mode Colors ##
    dark_color_primary = "hsl(180, 100%, 35%)"
    dark_color_canvas = "hsl(219, 16%, 17%)"
    dark_color_canvas-tint = "hsl(218, 17%, 26%)"
    dark_color_canvas_shade = "hsl(218, 18%, 9%)"
    dark_color_text = "hsl(0, 0%, 91%)"
    dark_color_text_muted = "hsl(0, 0%, 77%)"
    dark_color_text_inverted = "hsl(0, 0%, 15%)"
    dark_color_text_link = "hsl(174, 60%, 55%)"
    dark_color_ui_float = "hsl(220, 16%, 33%)"
    dark_border_color = "hsl(219, 28%, 88%)"
    dark_image_filter = "grayscale(35%)"

[params.giscus]
  repo = "ATIAboo/blog"
  repoID = ""          # 从 giscus.app 获取
  category = "General"
  categoryID = ""      # 从 giscus.app 获取
  mapping = "pathname"
  strict = "0"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "top"
  theme = "preferred_color_scheme"
  lang = "zh-CN"

[[menu.main]]
  identifier = "posts"
  name = "📝 文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "archives"
  name = "📚 归档"
  url = "/archives/"
  weight = 20

[[menu.main]]
  identifier = "tags"
  name = "🏷️ 标签"
  url = "/tags/"
  weight = 30

[[menu.main]]
  identifier = "search"
  name = "🔍 搜索"
  url = "/search/"
  weight = 40

[[menu.main]]
  identifier = "about"
  name = "🙋 关于"
  url = "/about/"
  weight = 50
